name: xos-agent
on:
  workflow_dispatch:
    inputs:
      os: { description: runner, default: macos-15 }
      tasks: { description: task array, default: '["ES55-git-mode-review","ES56-tar-producer-audit","ES57-ancient-date-index"]' }
      timeout: { description: agent seconds, default: '1500' }
      model: { description: existing project model, default: deepseek-v4.1-flash }
      tag: { description: run tag, default: es55-es57 }
      parallel: { description: jobs per OS pool, default: '1' }
permissions:
  contents: read
jobs:
  agent:
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22.17.0' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install pinned DSH
        working-directory: dsh
        shell: bash
        env: { NODE_OPTIONS: --max-old-space-size=4096 }
        run: npm ci --no-audit --no-fund
      - name: run real agent and fresh-data verification
        shell: bash
        env:
          ENVSHIFT_API_KEY: ${{ secrets.ENVSHIFT_API_KEY }}
          XOS_CELL: ${{ inputs.os }}
          TASK: ${{ matrix.task }}
          MODEL: ${{ inputs.model }}
          TIME_LIMIT: ${{ inputs.timeout }}
          PYTHONIOENCODING: utf-8
        run: python lab_agent_run.py --task "$TASK" --model "$MODEL" --timeout "$TIME_LIMIT"
      - name: encrypt full artifacts
        if: always()
        shell: bash
        env:
          ARTIFACT_PASS: ${{ secrets.ARTIFACT_PASS }}
        run: |
          tar czf out.tgz out
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_PASS -in out.tgz -out out.tgz.enc
          rm out.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enc-${{ inputs.os }}-${{ matrix.task }}
          path: out.tgz.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.os }}-${{ matrix.task }}
          path: public-results/
