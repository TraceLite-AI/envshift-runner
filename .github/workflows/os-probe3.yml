name: os-probe3
on:
  workflow_dispatch:
    inputs:
      oslist: { description: "runner 列表(JSON 数组)", default: '["ubuntu-24.04","macos-15","windows-2022"]' }
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 跑定向探针(故意不设 PYTHONUTF8,量默认编码)
        shell: bash
        run: python os_probe3.py > "probe3_${{ matrix.os }}.txt" 2>&1; cat "probe3_${{ matrix.os }}.txt" | head -5
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "probe3-${{ matrix.os }}", path: "probe3_*.txt" }
