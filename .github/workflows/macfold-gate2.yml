name: macfold-gate2
# 门二:真 agent 跑,量跨系统结局差异。前提是这道题已过门一三系统签名。
# ★题目材料从 secret 还原并核对指纹;并发闸门防网关 429(429 会造出空转格,伪装成「模型不行」)。
on:
  workflow_dispatch:
    inputs:
      tasks:
        default: '["M70-ledger-kelvin","M71-intake-longs","M72-vault-ohm","M73-billing-sharps","M74-roster-angst","M75-backup-nfd","B80-objstore-kelvin","B81-manifest-sharps","B82-shardidx-ohm","B83-pkgindex-angst"]'
      oslist:
        default: '["ubuntu-24.04","macos-15","windows-2022"]'
      model:
        description: "官网 API 只有 deepseek-flash / deepseek-v4-pro;网关别名 deepseek-v4.1-flash 官网不认"
        default: deepseek-flash
      key_secret: { description: "API key 所在 secret 名(DEEPSEEK_API_KEY | COMPUTRIX_API_KEY | ENVSHIFT_API_KEY)", default: "DEEPSEEK_API_KEY" }
      thinking: { description: "(dsh)on=DeepSeek 官网 thinking+reasoning_effort high(既有结果同请求体);off=两字段不上线(computrix 上跑非 DeepSeek 模型必须 off,见 dsh/patch_llm.mjs)", default: "on" }
      harness: { description: "agent 用哪套 harness:dsh | openclaw(npm -g 装 OpenClaw) | envshift(自建最小工具循环,随题包 envshift_agent.py,不装任何东西)", default: "dsh" }
      oc_version: { description: "(openclaw)OpenClaw 版本,闸门 2026.9.4;Node 自动用 24.16.0", default: "2026.9.4" }
      base:
        description: "API 基址。官网 https://api.deepseek.com/v1;网关 https://api.llmgateway.io/v1"
        default: https://api.deepseek.com/v1
      timeout:
        default: '1200'
      parallel:
        default: '3'
      max_tokens: { description: "(envshift)每次模型回复的上限;DeepSeek thinking 在长题上撞 8192 截断", default: "8192" }
      bundle_secret:
        description: "题包所在 secret 名(换题包时用新名字,别覆盖排队中的旧 run)"
        default: "MACFOLD_B64"
      bundle_sha256:
        required: true
jobs:
  agent:
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ inputs.harness == 'openclaw' && '24.16.0' || '22.17.0' }}" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore bundle
        shell: bash
        env:
          MACFOLD_B64: ${{ secrets[inputs.bundle_secret] }}
        run: python macfold_restore.py "${{ inputs.bundle_sha256 }}" macfold
      - name: install OpenClaw (harness=openclaw)
        if: ${{ inputs.harness == 'openclaw' }}
        shell: bash
        run: npm install -g openclaw@${{ inputs.oc_version }} 2>&1 | tail -1 && node "$(npm root -g)/openclaw/openclaw.mjs" --version
      - name: install DSH
        if: ${{ inputs.harness == 'dsh' }}
        shell: bash
        working-directory: dsh
        env: { NODE_OPTIONS: --max-old-space-size=4096 }
        run: |
          npm ci --no-audit --no-fund 2>&1 | tail -2
          node patch_llm.mjs
      - name: run agent
        shell: bash
        working-directory: macfold
        env:
          XOS_CELL: ${{ matrix.os }}
          ENVSHIFT_API_KEY: ${{ secrets[inputs.key_secret] }}
          DSH_DIR: ${{ github.workspace }}/dsh
          DSH_MAX_TOKENS: "131072"
          DSH_THINKING: ${{ inputs.thinking }}
          ENVSHIFT_MAX_TOKENS: ${{ inputs.max_tokens }}
        run: python run_one.py --task "${{ matrix.task }}" --arm agent --harness "${{ inputs.harness }}" --model "${{ inputs.model }}" --base "${{ inputs.base }}" --timeout ${{ inputs.timeout }} || true
      - name: 打包并加密轨迹(driver.log / trace.jsonl / final.json / verifier 日志 / 交付物)
        # ★此前 gate2 只留 2000 字 driver.log 尾部,53 道 deepseek 题的逐步轨迹没有保住(2026-09-20 发现)。
        #   从这一步起每格都上传加密产物;口令 = GUIB_PASS(与 GUI 产物同一份 .artifact-pass)。
        if: always()
        shell: python
        working-directory: macfold
        env:
          ARTIFACT_PASS: ${{ secrets.GUIB_PASS }}
          CELL_TASK: ${{ matrix.task }}
          CELL_OS: ${{ matrix.os }}
        run: |
          import os, pathlib, subprocess, tarfile
          d = pathlib.Path("_out") / (os.environ["CELL_TASK"] + "-agent")
          if not d.exists():
              raise SystemExit("no _out dir; setup failure")
          keep = []
          for f in ("driver.log", "driver.stdout", "trace.jsonl", "final.json", "stderr.txt", "verifier.log", "fixture.log", "meta.json", "agent.json", "agent.stderr", "gateway.log"):
              if (d / f).exists(): keep.append(d / f)
          keep += list((d / "verifier-log").glob("*")) if (d / "verifier-log").exists() else []
          keep += [q for q in (d / "oc-state").rglob("*") if q.is_file()] if (d / "oc-state").exists() else []  # OpenClaw 会话记录(轨迹)
          with tarfile.open("cell.tgz", "w:gz") as tf:
              for f in keep: tf.add(f, arcname=f.relative_to(d).as_posix())
              app = pathlib.Path("_app")
              if app.exists(): tf.add(app, arcname="delivered")
          if not os.environ.get("ARTIFACT_PASS"):
              raise SystemExit("missing GUIB_PASS")
          subprocess.run(["openssl", "enc", "-aes-256-cbc", "-pbkdf2", "-salt", "-pass", "env:ARTIFACT_PASS", "-in", "cell.tgz", "-out", "cell.enc"], check=True)
          pathlib.Path("cell.tgz").unlink()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate2-${{ matrix.task }}-${{ matrix.os }}-${{ github.run_id }}
          path: macfold/cell.enc
          retention-days: 90
          if-no-files-found: warn
      - name: 驱动日志尾部(定位 agent 起没起来)
        if: always()
        shell: bash
        working-directory: macfold
        run: |
          D="_out/${{ matrix.task }}-agent"
          echo "---- driver.log 尾部 ----"
          tail -c 2000 "$D/driver.log" 2>/dev/null || echo "(无 driver.log)"
          echo "---- 交付物是否被改过 ----"
          ls -l "$D" 2>/dev/null | head -8
