name: probe
on:
  workflow_dispatch:
jobs:
  native:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe real kernel and filesystem behavior three times
        shell: bash
        run: python oscore-native-probe.py --repeat 3 --output native-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: native-results.json
          if-no-files-found: error
          retention-days: 30
