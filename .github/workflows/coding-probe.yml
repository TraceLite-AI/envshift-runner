name: coding-probe
on:
  workflow_dispatch:
    inputs:
      oslist: { default: '["ubuntu-24.04","macos-15","windows-2022"]' }
      script: { default: 'coding_mech_probe.py' }
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: python ${{ inputs.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'cprobe-${{ matrix.os }}', path: probe_out/, retention-days: 7 }
