name: xos-tasks
on:
  workflow_dispatch:
    inputs:
      os: { description: "runner(可选 ubuntu-24.04 / ubuntu-24.04-arm / windows-2022 / windows-11-arm / macos-14)", default: "macos-14" }
      arms: { description: "臂(逗号分隔)", default: "oracle,naive" }
      tasks: { description: "任务 JSON 数组", default: '["E3-archive-audit","E4-vault-compliance","E5-retention-plan","E6-contact-merge","E7-publish-shared","E8-report-extend","E9-latest-extend","E10-dupes-extend","E11-export-extend","E12-publish-extend"]' }
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ${{ inputs.os }}
    env: { PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore task materials
        shell: bash
        run: |
          printf %s "$TB1" >> tasks_b64.txt
          printf %s "$TB2" >> tasks_b64.txt
          printf %s "$TB3" >> tasks_b64.txt
          printf %s "$TB4" >> tasks_b64.txt
          printf %s "$TB5" >> tasks_b64.txt
          printf %s "$TB6" >> tasks_b64.txt
          printf %s "$TB7" >> tasks_b64.txt
          printf %s "$TB8" >> tasks_b64.txt
          printf %s "$TB9" >> tasks_b64.txt
          printf %s "$TB10" >> tasks_b64.txt
          printf %s "$TB11" >> tasks_b64.txt
          printf %s "$TB12" >> tasks_b64.txt
          printf %s "$TB13" >> tasks_b64.txt
          printf %s "$TB14" >> tasks_b64.txt
          printf %s "$TB15" >> tasks_b64.txt
          printf %s "$TB16" >> tasks_b64.txt
          printf %s "$TB17" >> tasks_b64.txt
          printf %s "$TB18" >> tasks_b64.txt
          printf %s "$TB19" >> tasks_b64.txt
          printf %s "$TB20" >> tasks_b64.txt
          printf %s "$TB21" >> tasks_b64.txt
          printf %s "$TB22" >> tasks_b64.txt
          printf %s "$TB23" >> tasks_b64.txt
          printf %s "$TB24" >> tasks_b64.txt
          printf %s "$TB25" >> tasks_b64.txt
          printf %s "$TB26" >> tasks_b64.txt
          printf %s "$TB27" >> tasks_b64.txt
          printf %s "$TB28" >> tasks_b64.txt
          printf %s "$TB29" >> tasks_b64.txt
          printf %s "$TB30" >> tasks_b64.txt
          printf %s "$TB31" >> tasks_b64.txt
          printf %s "$TB32" >> tasks_b64.txt
          printf %s "$TB33" >> tasks_b64.txt
          printf %s "$TB34" >> tasks_b64.txt
          printf %s "$TB35" >> tasks_b64.txt
          printf %s "$TB36" >> tasks_b64.txt
          printf %s "$TB37" >> tasks_b64.txt
          python restore_tasks.py
        env:
          TB1: ${{ secrets.TASKS_B64_1 }}
          TB2: ${{ secrets.TASKS_B64_2 }}
          TB3: ${{ secrets.TASKS_B64_3 }}
          TB4: ${{ secrets.TASKS_B64_4 }}
          TB5: ${{ secrets.TASKS_B64_5 }}
          TB6: ${{ secrets.TASKS_B64_6 }}
          TB7: ${{ secrets.TASKS_B64_7 }}
          TB8: ${{ secrets.TASKS_B64_8 }}
          TB9: ${{ secrets.TASKS_B64_9 }}
          TB10: ${{ secrets.TASKS_B64_10 }}
          TB11: ${{ secrets.TASKS_B64_11 }}
          TB12: ${{ secrets.TASKS_B64_12 }}
          TB13: ${{ secrets.TASKS_B64_13 }}
          TB14: ${{ secrets.TASKS_B64_14 }}
          TB15: ${{ secrets.TASKS_B64_15 }}
          TB16: ${{ secrets.TASKS_B64_16 }}
          TB17: ${{ secrets.TASKS_B64_17 }}
          TB18: ${{ secrets.TASKS_B64_18 }}
          TB19: ${{ secrets.TASKS_B64_19 }}
          TB20: ${{ secrets.TASKS_B64_20 }}
          TB21: ${{ secrets.TASKS_B64_21 }}
          TB22: ${{ secrets.TASKS_B64_22 }}
          TB23: ${{ secrets.TASKS_B64_23 }}
          TB24: ${{ secrets.TASKS_B64_24 }}
          TB25: ${{ secrets.TASKS_B64_25 }}
          TB26: ${{ secrets.TASKS_B64_26 }}
          TB27: ${{ secrets.TASKS_B64_27 }}
          TB28: ${{ secrets.TASKS_B64_28 }}
          TB29: ${{ secrets.TASKS_B64_29 }}
          TB30: ${{ secrets.TASKS_B64_30 }}
          TB31: ${{ secrets.TASKS_B64_31 }}
          TB32: ${{ secrets.TASKS_B64_32 }}
          TB33: ${{ secrets.TASKS_B64_33 }}
          TB34: ${{ secrets.TASKS_B64_34 }}
          TB35: ${{ secrets.TASKS_B64_35 }}
          TB36: ${{ secrets.TASKS_B64_36 }}
          TB37: ${{ secrets.TASKS_B64_37 }}
      - name: prepare /data /app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ES2_ROOT="$USERPROFILE/es2"; else ES2_ROOT="$HOME/es2"; fi
          echo "ES2_ROOT=$ES2_ROOT" >> "$GITHUB_ENV"; mkdir -p "$ES2_ROOT/data" "$ES2_ROOT/app" && python profile_runner.py
      - name: self-check arms
        shell: bash
        env: { XOS_CELL: "${{ inputs.os }}-baseline" }
        run: |
          IFS=, read -ra ARMS <<< "${{ inputs.arms }}"
          case "$RUNNER_OS" in macOS) HM=$(stat -f %Lp "$HOME") ;; Linux) HM=$(stat -c %a "$HOME") ;; *) HM="" ;; esac
          for A in "${ARMS[@]}"; do [ -z "${HM:-}" ] || chmod "$HM" "$HOME"; python xos_run_one.py --task ${{ matrix.task }} --arm "$A" --data "$ES2_ROOT/data" --app "$ES2_ROOT/app" --out "out/${{ matrix.task }}-$A" $( [ "$RUNNER_OS" = "Windows" ] || echo --sudo-verify ) | tail -1; done
