name: xos-tasks
on:
  workflow_dispatch:
    inputs:
      os: { description: "runner(可选 ubuntu-24.04 / ubuntu-24.04-arm / windows-2022 / windows-11-arm / macos-14)", default: "macos-14" }
      arms: { description: "臂(逗号分隔)", default: "oracle,naive" }
      tasks: { description: "任务 JSON 数组", default: '["E3-archive-audit","E4-vault-compliance","E5-retention-plan","E6-contact-merge","E7-publish-shared","E8-report-extend","E9-latest-extend","E10-dupes-extend","E11-export-extend","E12-publish-extend"]' }
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ${{ inputs.os }}
    env: { PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore task materials
        shell: bash
        env:
          TASKS_B64_1: ${{ secrets.TASKS_B64_1 }}
          TASKS_B64_2: ${{ secrets.TASKS_B64_2 }}
          TASKS_B64_3: ${{ secrets.TASKS_B64_3 }}
          TASKS_B64_4: ${{ secrets.TASKS_B64_4 }}
          TASKS_B64_5: ${{ secrets.TASKS_B64_5 }}
          TASKS_B64_6: ${{ secrets.TASKS_B64_6 }}
          TASKS_B64_7: ${{ secrets.TASKS_B64_7 }}
          TASKS_B64_8: ${{ secrets.TASKS_B64_8 }}
          TASKS_B64_9: ${{ secrets.TASKS_B64_9 }}
          TASKS_B64_10: ${{ secrets.TASKS_B64_10 }}
          TASKS_B64_11: ${{ secrets.TASKS_B64_11 }}
          TASKS_B64_12: ${{ secrets.TASKS_B64_12 }}
          TASKS_B64_13: ${{ secrets.TASKS_B64_13 }}
          TASKS_B64_14: ${{ secrets.TASKS_B64_14 }}
          TASKS_B64_15: ${{ secrets.TASKS_B64_15 }}
          TASKS_B64_16: ${{ secrets.TASKS_B64_16 }}
          TASKS_B64_17: ${{ secrets.TASKS_B64_17 }}
          TASKS_B64_18: ${{ secrets.TASKS_B64_18 }}
          TASKS_B64_19: ${{ secrets.TASKS_B64_19 }}
          TASKS_B64_20: ${{ secrets.TASKS_B64_20 }}
          TASKS_B64_21: ${{ secrets.TASKS_B64_21 }}
          TASKS_B64_22: ${{ secrets.TASKS_B64_22 }}
          TASKS_B64_23: ${{ secrets.TASKS_B64_23 }}
          TASKS_B64_24: ${{ secrets.TASKS_B64_24 }}
          TASKS_B64_25: ${{ secrets.TASKS_B64_25 }}
          TASKS_B64_26: ${{ secrets.TASKS_B64_26 }}
          TASKS_B64_27: ${{ secrets.TASKS_B64_27 }}
          TASKS_B64_28: ${{ secrets.TASKS_B64_28 }}
        run: python restore_tasks.py
      - name: prepare /data /app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ES2_ROOT="$USERPROFILE/es2"; else ES2_ROOT="$HOME/es2"; fi
          echo "ES2_ROOT=$ES2_ROOT" >> "$GITHUB_ENV"; mkdir -p "$ES2_ROOT/data" "$ES2_ROOT/app" && python profile_runner.py
      - name: self-check arms
        shell: bash
        env: { XOS_CELL: "${{ inputs.os }}-baseline" }
        run: |
          IFS=, read -ra ARMS <<< "${{ inputs.arms }}"
          case "$RUNNER_OS" in macOS) HM=$(stat -f %Lp "$HOME") ;; Linux) HM=$(stat -c %a "$HOME") ;; *) HM="" ;; esac
          for A in "${ARMS[@]}"; do [ -z "${HM:-}" ] || chmod "$HM" "$HOME"; python xos_run_one.py --task ${{ matrix.task }} --arm "$A" --data "$ES2_ROOT/data" --app "$ES2_ROOT/app" --out "out/${{ matrix.task }}-$A" $( [ "$RUNNER_OS" = "Windows" ] || echo --sudo-verify ) | tail -1; done
