name: macgui-probe
on:
  workflow_dispatch:
    inputs:
      oslist: { default: '["ubuntu-24.04","macos-15","windows-2022"]' }
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - shell: bash
        run: python -m pip install -q websocket-client==1.9.2 PyAutoGUI==0.9.54 pillow==12.3.0 mss==10.2.0
      - name: Linux desktop + Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth x11-utils scrot python3-tk openbox dbus-x11
          if ! command -v google-chrome >/dev/null; then curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/c.deb" && sudo apt-get install -y "$RUNNER_TEMP/c.deb"; fi
          touch "$HOME/.Xauthority"; xauth add :99 . $(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          Xvfb :99 -screen 0 1280x900x24 -auth "$HOME/.Xauthority" -nolisten tcp & sleep 3; DISPLAY=:99 openbox & sleep 1
          echo "DISPLAY=:99" >> $GITHUB_ENV; echo "XAUTHORITY=$HOME/.Xauthority" >> $GITHUB_ENV
      - name: macOS Chrome
        if: runner.os == 'macOS'
        shell: bash
        run: if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then brew install --cask google-chrome; fi
      - name: Windows Chrome
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (!(Test-Path 'C:\Program Files\Google\Chrome\Application\chrome.exe') -and !(Test-Path 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe')) { choco install googlechrome --yes --no-progress }
      - shell: bash
        run: python macgui_probe.py
