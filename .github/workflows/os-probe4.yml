name: os-probe4
on: { workflow_dispatch: {} }
jobs:
  probe:
    strategy: { fail-fast: false, matrix: { os: ["ubuntu-24.04","macos-15","windows-2022"] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 装 numpy(CAND-30/52 要用)
        shell: bash
        run: python -m pip install -q numpy || echo "numpy 装不上"
      - name: 跑定向探针
        shell: bash
        env: { PYTHONUTF8: '1' }
        run: python os_probe4.py > "probe4_${{ matrix.os }}.txt" 2>&1; head -3 "probe4_${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "probe4-${{ matrix.os }}", path: "probe4_*.txt" }
