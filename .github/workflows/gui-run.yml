name: gui-run
on:
  workflow_dispatch:
    inputs:
      oslist: { description: runners, default: '["ubuntu-24.04","macos-15","windows-2022"]' }
      tasks: { description: GUI tasks, default: '["G21","G22","G23","G24","G25"]' }
      trials: { description: independent fresh-runner trials, default: '[1]' }
      arm: { description: control or agent, default: control }
      model: { description: existing GUI model, default: gemini-3.5-flash }
      steps: { description: action budget, default: '60' }
permissions:
  contents: read
jobs:
  native-dialog:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
        task: ${{ fromJSON(inputs.tasks) }}
        trial: ${{ fromJSON(inputs.trials) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install GUI dependencies
        shell: bash
        run: python -m pip install -q mss pyautogui==0.9.54 pillow websocket-client
      - name: prepare display and Chrome
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth x11-utils scrot python3-tk openbox dbus-x11
            touch "$HOME/.Xauthority"
            xauth add :99 . $(python -c 'import secrets;print(secrets.token_hex(16))')
            Xvfb :99 -screen 0 1280x900x24 -auth "$HOME/.Xauthority" > /tmp/xvfb.log 2>&1 &
            sleep 2
            DISPLAY=:99 XAUTHORITY="$HOME/.Xauthority" openbox > /tmp/openbox.log 2>&1 &
            sleep 2
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
            echo "XAUTHORITY=$HOME/.Xauthority" >> "$GITHUB_ENV"
            command -v google-chrome || command -v google-chrome-stable || { curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb; sudo apt-get install -y /tmp/chrome.deb; }
          elif [ "$RUNNER_OS" = macOS ]; then
            test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" || brew install --cask google-chrome
          else
            test -f '/c/Program Files/Google/Chrome/Application/chrome.exe' || choco install googlechrome -y --no-progress
          fi
      - name: record runtime before the trial
        shell: bash
        env:
          TRIAL_INDEX: ${{ matrix.trial }}
          TASK_ID: ${{ matrix.task }}
        run: |
          mkdir -p repeat_metadata
          python -m pip freeze > repeat_metadata/pip-freeze.txt
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, sys
          names = ['gui_batch7.py','gui_agent_loop.py','task_world.py','task_server.py','reference_ui.py','app.js','app.css','scroll_probe.py']
          result = {'trial': os.environ['TRIAL_INDEX'], 'task': os.environ['TASK_ID'],
                    'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                    'source_sha256': {n: hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in names},
                    'python': sys.version, 'platform': platform.platform(), 'machine': platform.machine(),
                    'runner_image': {k: os.environ.get(k) for k in ['ImageOS','ImageVersion','RUNNER_OS','RUNNER_ARCH']}}
          pathlib.Path('repeat_metadata/runtime.json').write_text(json.dumps(result, indent=2))
          PY
      - name: run GUI task
        shell: bash
        env:
          ENVSHIFT_API_KEY: ${{ inputs.arm == 'agent' && secrets.ENVSHIFT_API_KEY || '' }}
          ARM: ${{ inputs.arm }}
          TASK: ${{ matrix.task }}
          MODEL: ${{ inputs.model }}
          STEPS: ${{ inputs.steps }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- python gui_batch7.py --task "$TASK" --arm "$ARM" --model "$MODEL" --steps "$STEPS"
          else
            python gui_batch7.py --task "$TASK" --arm "$ARM" --model "$MODEL" --steps "$STEPS"
          fi
      - name: pack complete evidence without changing original bytes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil, tarfile
          out = pathlib.Path('gui_batch7_out')
          out.mkdir(exist_ok=True)
          if pathlib.Path('repeat_metadata').exists():
              shutil.copytree('repeat_metadata', out / 'repeat_metadata', dirs_exist_ok=True)
          manifest = {p.relative_to(out).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(out.rglob('*')) if p.is_file()}
          (out / 'EVIDENCE_SHA256.json').write_text(json.dumps(manifest, indent=2))
          packet = pathlib.Path('repeat_packet')
          packet.mkdir(exist_ok=True)
          with tarfile.open(packet / 'evidence.tar.xz', 'w:xz') as tar:
              tar.add(out, arcname='evidence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-batch7-${{ matrix.task }}-${{ matrix.os }}-${{ inputs.arm }}-trial${{ matrix.trial }}
          path: repeat_packet/
          compression-level: 0
