name: toolshift30
on:
  workflow_dispatch:
    inputs:
      arm: {description: control or agent, default: control}
      model: {description: existing model, default: gemini-3.5-flash}
      steps: {description: maximum model actions per trial, default: '60'}
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        slot: [0, 1, 2]
    runs-on: ${{ inputs.arm == 'control' && fromJSON('["ubuntu-24.04","macos-15","windows-2022"]')[matrix.slot] || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore isolated private task package
        shell: bash
        env:
          TASK_PACKAGE: ${{ secrets.TOOLSHIFT30_20260915_B64 }}
          EXPECTED_PACKAGE_SHA256: 99f29bbe0b7ab086919f3a8030914a40e61a5191677adda26ad4eaeb6436400b
        run: |
          python - <<'PY'
          import base64,hashlib,io,os,pathlib,tarfile
          data=base64.b64decode(os.environ['TASK_PACKAGE'],validate=True)
          assert hashlib.sha256(data).hexdigest()==os.environ['EXPECTED_PACKAGE_SHA256']
          root=pathlib.Path('toolshift_private');root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              for member in tar.getmembers():
                  p=pathlib.PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and member.isfile()
                  dest=root.joinpath(*p.parts);dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(tar.extractfile(member).read())
          print('Private package verified:',hashlib.sha256(data).hexdigest())
          PY
      - name: Execute controls or model trials
        shell: bash
        env:
          ENVSHIFT_API_KEY: ${{ inputs.arm == 'agent' && secrets.ENVSHIFT_API_KEY || '' }}
          EXPECTED_PACKAGE_SHA256: 99f29bbe0b7ab086919f3a8030914a40e61a5191677adda26ad4eaeb6436400b
          ARM: ${{ inputs.arm }}
          MODEL: ${{ inputs.model }}
          STEPS: ${{ inputs.steps }}
          SLOT: ${{ matrix.slot }}
          PYTHONIOENCODING: utf-8
        run: python toolshift_private/run_batch.py --arm "$ARM" --shard "$SLOT" --model "$MODEL" --steps "$STEPS" --out toolshift_evidence
      - name: Encrypt complete evidence
        if: always()
        shell: bash
        env:
          TOOLSHIFT_ENCRYPTION_KEY: ${{ secrets.TOOLSHIFT30_20260915_KEY }}
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,tarfile
          out=pathlib.Path('toolshift_evidence');out.mkdir(exist_ok=True)
          hashes={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.rglob('*')) if p.is_file() and p.name!='EVIDENCE_SHA256.json'}
          (out/'EVIDENCE_SHA256.json').write_text(json.dumps(hashes,indent=2))
          with tarfile.open('evidence.tar.gz','w:gz') as tar:tar.add(out,arcname='evidence')
          PY
          mkdir -p encrypted_packet
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 -in evidence.tar.gz -out encrypted_packet/evidence.enc -pass env:TOOLSHIFT_ENCRYPTION_KEY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolshift30-${{ inputs.arm }}-slot${{ matrix.slot }}
          path: encrypted_packet/
          compression-level: 0
          retention-days: 30
