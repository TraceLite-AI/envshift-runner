name: swe-arch
on:
  workflow_dispatch:
    inputs:
      instance: { description: "SWE-bench 实例 id", default: "django__django-15037" }
jobs:
  gold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: ubuntu-24.04, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: official swebench package
        run: pip install -q swebench==5.0.2 pyarrow
      - name: gold patch on official ${{ matrix.arch }} image
        run: python swe_arm_gold.py "${{ inputs.instance }}" ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "swe-${{ matrix.arch }}-${{ inputs.instance }}", path: result_*.json }
