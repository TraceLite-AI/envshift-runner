name: macfold-gate1
on:
  workflow_dispatch:
    inputs:
      tasks:
        default: '["M70-ledger-kelvin","M71-intake-longs","M72-vault-ohm"]'
      oslist:
        default: '["ubuntu-24.04","macos-15","windows-2022"]'
      arms:
        default: "oracle,naive"
      bundle_sha256:
        description: "题包 sha256,对不上就退出"
        required: true
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oslist) }}
        task: ${{ fromJSON(inputs.tasks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore bundle
        shell: bash
        env:
          MACFOLD_B64: ${{ secrets.MACFOLD_B64 }}
        run: python macfold_restore.py "${{ inputs.bundle_sha256 }}" macfold
      - name: run arms
        shell: bash
        working-directory: macfold
        env:
          XOS_CELL: ${{ matrix.os }}
        run: |
          IFS=, read -ra ARMS <<< "${{ inputs.arms }}"
          for A in "${ARMS[@]}"; do
            python run_one.py --task "${{ matrix.task }}" --arm "$A" || true
          done
