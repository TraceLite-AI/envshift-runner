name: sandbox-verify
# Realise and verify the OS-level runtime sandbox variants of the TraceLite env-suite with the registry probe.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated variant ids (empty = all)"
        required: false
        default: ""
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: gh-arm64,       os: ubuntu-24.04-arm, how: plain}
          - {id: gh-macos,       os: macos-15,        how: plain}
          - {id: gh-unicode-ni,  os: macos-15,        how: plain}
          - {id: gh-unicode-nfd, os: macos-15,        how: plain}
          - {id: gh-bsd,         os: macos-15,        how: plain}
          - {id: gh-windows,     os: windows-2022,    how: pwsh}
          - {id: gh-winmaxpath,  os: windows-2022,    how: pwsh}
          - {id: gh-winreserved, os: windows-2022,    how: pwsh}
          - {id: gh-backslash,   os: windows-2022,    how: pwsh}
          - {id: gh-cp1252,      os: windows-2022,    how: pwsh}
          - {id: gh-winnative,   os: windows-2022,    how: winnative}
          - {id: gh-ps5,         os: windows-2022,    how: ps5}
          - {id: gh-cmd,         os: windows-2022,    how: cmd}
          - {id: gh-wsl,         os: windows-2022,    how: wsl}
          - {id: gh-kc-full,     os: ubuntu-24.04,    how: plain}
          - {id: gh-kc-nofuse,   os: ubuntu-24.04,    how: docker, devices: "--device /dev/kvm --device /dev/loop-control"}
          - {id: gh-kc-noloop,   os: ubuntu-24.04,    how: docker, devices: "--device /dev/kvm --device /dev/fuse"}
          - {id: gh-bare,        os: ubuntu-24.04,    how: plain}
          - {id: gh-vm,          os: ubuntu-24.04,    how: vm}
          - {id: gh-microvm,     os: ubuntu-24.04,    how: microvm}
          - {id: gh-android,     os: ubuntu-24.04,    how: android}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: gate
        shell: bash
        env: {ONLY: "${{ inputs.only }}"}
        run: if [ -n "$ONLY" ] && [[ ",$ONLY," != *",${{ matrix.id }},"* ]]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1' && (matrix.how != 'wsl' && matrix.how != 'vm' && matrix.how != 'docker' && matrix.how != 'microvm')
        with: {python-version: "3.12"}
      - name: setup variant
        if: env.SKIP != '1'
        shell: bash
        run: |
          PYBIN=$(command -v python3 || command -v python)
          $PYBIN sandbox/sandbox_gh.py setup ${{ matrix.id }} | tee -a "$GITHUB_ENV"
      # ---------- probe, one way per realisation ----------
      - name: probe (plain)
        if: env.SKIP != '1' && (matrix.how == 'plain')
        shell: bash
        run: python3 sandbox/envstd.py probe > probe.json
      - name: probe (pwsh)
        if: env.SKIP != '1' && (matrix.how == 'pwsh')
        shell: pwsh
        env: {PYTHONIOENCODING: utf-8}   # stdout encoding of the probe only; the system code page is untouched
        run: python sandbox/envstd.py probe | Out-File -Encoding utf8 probe.json
      - name: probe (windows-native PATH)
        if: env.SKIP != '1' && (matrix.how == 'winnative')
        shell: pwsh
        env: {PYTHONIOENCODING: utf-8}   # stdout encoding of the probe only; the system code page is untouched
        run: |
          $env:PATH = $env:SANDBOX_PATH
          python sandbox/envstd.py probe | Out-File -Encoding utf8 probe.json
      - name: probe (Windows PowerShell 5.1)
        if: env.SKIP != '1' && (matrix.how == 'ps5')
        shell: powershell
        env: {PYTHONIOENCODING: utf-8}   # stdout encoding of the probe only; the system code page is untouched
        run: python sandbox/envstd.py probe | Out-File -Encoding utf8 probe.json
      - name: probe (cmd)
        if: env.SKIP != '1' && (matrix.how == 'cmd')
        shell: cmd
        env: {PYTHONIOENCODING: utf-8}   # stdout encoding of the probe only; the system code page is untouched
        run: |
          set PSModulePath=
          python sandbox\envstd.py probe > probe.json
      - name: probe (docker, device subset)
        if: env.SKIP != '1' && (matrix.how == 'docker')
        shell: bash
        run: |
          docker run --rm ${{ matrix.devices }} -v "$PWD/sandbox:/s:ro" python:3.12-slim python3 /s/envstd.py probe > probe.json
      - name: set up WSL
        if: env.SKIP != '1' && (matrix.how == 'wsl')
        uses: Vampire/setup-wsl@v3
        with: {distribution: Ubuntu-22.04, additional-packages: python3}
      - name: probe (inside WSL)
        if: env.SKIP != '1' && (matrix.how == 'wsl')
        shell: wsl-bash {0}
        env: {PYTHONIOENCODING: utf-8}   # stdout encoding of the probe only; the system code page is untouched
        run: python3 sandbox/envstd.py probe > probe.json && cat /proc/version > wslver.txt
      - name: probe (QEMU/KVM guest)
        if: env.SKIP != '1' && (matrix.how == 'vm')
        shell: bash
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          sudo chmod 666 /dev/kvm
          curl -fsSL -o base.img https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          qemu-img create -f qcow2 -F qcow2 -b base.img disk.qcow2 8G >/dev/null
          B64P=$(base64 -w0 sandbox/envstd.py); B64D=$(base64 -w0 sandbox/dimensions.json)
          cat > user-data <<UD
          #cloud-config
          write_files:
            - {path: /opt/p/envstd.py, encoding: b64, content: $B64P}
            - {path: /opt/p/dimensions.json, encoding: b64, content: $B64D}
          runcmd:
            - [bash, -c, "cd /opt/p && python3 envstd.py probe > /opt/p/out.json; V=\$(systemd-detect-virt); python3 -c \"import json;d=json.load(open('/opt/p/out.json'));d['virt']='\$V';print('@@PROBE@@'+json.dumps(d)+'@@END@@')\" > /dev/ttyS0; poweroff"]
          UD
          sed -i 's/^          //' user-data
          cloud-localds seed.img user-data
          timeout 900 qemu-system-x86_64 -enable-kvm -m 2048 -smp 2 -nographic -serial file:serial.log -monitor none \
            -drive file=disk.qcow2,if=virtio -drive file=seed.img,if=virtio,format=raw -netdev user,id=n0 -device virtio-net-pci,netdev=n0 || true
          python3 -c "import re;s=open('serial.log',errors='ignore').read();m=re.search(r'@@PROBE@@(.*?)@@END@@',s,re.S);open('probe.json','w').write(m.group(1))"
      - name: probe (Firecracker microVM)
        if: env.SKIP != '1' && (matrix.how == 'microvm')
        shell: bash
        run: |
          set -e
          set -x
          sudo chmod 666 /dev/kvm
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q squashfs-tools
          A=x86_64; R=https://github.com/firecracker-microvm/firecracker/releases
          L=$(basename $(curl -fsSLI -o /dev/null -w %{url_effective} $R/latest))
          curl -fsSL $R/download/$L/firecracker-$L-$A.tgz | tar -xz; mv release-$L-$A/firecracker-$L-$A fc
          K=""; U=""
          for CI in ${L%.*} v1.16 v1.15 v1.14 v1.13 v1.12 v1.11 v1.10; do
            K=$(curl -s "http://spec.ccfc.min.s3.amazonaws.com/?prefix=firecracker-ci/$CI/$A/vmlinux-&list-type=2" | grep -oP "(?<=<Key>)(firecracker-ci/$CI/$A/vmlinux-[0-9]+\.[0-9]+\.[0-9]{1,3})(?=</Key>)" | sort -V | tail -1 || true)
            U=$(curl -s "http://spec.ccfc.min.s3.amazonaws.com/?prefix=firecracker-ci/$CI/$A/ubuntu-&list-type=2" | grep -oP "(?<=<Key>)(firecracker-ci/$CI/$A/ubuntu-[0-9]+\.[0-9]+\.squashfs)(?=</Key>)" | sort -V | tail -1 || true)
            [ -n "$K" ] && [ -n "$U" ] && break
          done
          echo "kernel=$K rootfs=$U"
          curl -fsSL -o vmlinux https://s3.amazonaws.com/spec.ccfc.min/$K
          curl -fsSL -o root.squashfs https://s3.amazonaws.com/spec.ccfc.min/$U
          sudo unsquashfs -q -d rootfs root.squashfs
          sudo mkdir -p rootfs/opt/p && sudo cp sandbox/envstd.py sandbox/dimensions.json rootfs/opt/p/
          printf '%s\n' '#!/bin/sh' 'mount -t proc proc /proc; mount -t sysfs sys /sys; mount -t tmpfs tmp /tmp' \
            'V=$(systemd-detect-virt 2>/dev/null || echo unknown); P=$(ls /sys/bus/pci/devices 2>/dev/null | wc -l)' \
            'if command -v python3 >/dev/null; then cd /opt/p && python3 envstd.py probe > /tmp/o.json 2>/dev/null; else echo "{\"readings\":{\"E2.1.os\":{\"value\":\"linux\"}}}" > /tmp/o.json; fi' \
            'python3 -c "import json;d=json.load(open(\"/tmp/o.json\"));d[\"virt\"]=\"$V\";d[\"pci_devices\"]=\"$P\";print(\"@@PROBE@@\"+json.dumps(d)+\"@@END@@\")" 2>/dev/null || echo "@@PROBE@@{\"readings\":{\"E2.1.os\":{\"value\":\"linux\"}},\"virt\":\"$V\",\"pci_devices\":\"$P\"}@@END@@"' \
            'reboot -f' | sudo tee rootfs/run_probe.sh >/dev/null
          sudo chmod +x rootfs/run_probe.sh
          truncate -s 1G rootfs.ext4 && sudo mkfs.ext4 -q -d rootfs -F rootfs.ext4
          cat > vm.json <<'JSON'
          {"boot-source": {"kernel_image_path": "vmlinux", "boot_args": "console=ttyS0 reboot=k panic=1 pci=off init=/run_probe.sh"},
           "drives": [{"drive_id": "rootfs", "path_on_host": "rootfs.ext4", "is_root_device": true, "is_read_only": false}],
           "machine-config": {"vcpu_count": 2, "mem_size_mib": 1024}}
          JSON
          sed -i 's/^          //' vm.json
          timeout 300 ./fc --no-api --config-file vm.json > serial.log 2>&1 || true
          tail -c 3000 serial.log
          python3 -c "import re;s=open('serial.log',errors='ignore').read();m=re.search(r'@@PROBE@@(.*?)@@END@@',s,re.S);open('probe.json','w').write(m.group(1))"
      - name: enable KVM (Android emulator)
        if: env.SKIP != '1' && (matrix.how == 'android')
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: probe (Android emulator via adb)
        if: env.SKIP != '1' && (matrix.how == 'android')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: adb shell getprop ro.build.version.release > android_ver.txt && adb shell uname -m >> android_ver.txt && python3 sandbox/sandbox_gh.py android-probe android_ver.txt > probe.json
      - name: check
        if: env.SKIP != '1'
        shell: bash
        run: |
          PYBIN=$(command -v python3 || command -v python)
          $PYBIN -c "import io,sys;p='probe.json';b=open(p,'rb').read();b=b[3:] if b.startswith(b'\xef\xbb\xbf') else b;t=b.decode('utf-8','replace');open(p,'w',encoding='utf-8').write(t[t.find('{'):])"
          $PYBIN sandbox/sandbox_gh.py check ${{ matrix.id }} probe.json
      - uses: actions/upload-artifact@v4
        if: always() && env.SKIP != '1'
        with: {name: "verify-${{ matrix.id }}", path: "verify-*.json", if-no-files-found: ignore}
