name: gui-bench
# Native v2 GUI 题包(从分片 secret 还原,不进公开仓)× 三系统:reference(不请求模型)或 agent(内置 DeepSeek GUI agent)。
on:
  workflow_dispatch:
    inputs:
      tasks: { description: "题号 JSON 数组", default: '["G01","G21"]' }
      oslist: { description: "runner 列表(JSON 数组)", default: '["ubuntu-24.04","macos-15","windows-2022"]' }
      mode: { description: "reference | agent", default: "reference" }
      model: { description: "内置 GUI agent 模型", default: "deepseek-flash" }
      steps: { description: "动作预算,空=各题默认", default: "" }
      parallel: { description: "max-parallel", default: "3" }
      bundle_sha256: { description: "题包 sha256,对不上就退出", required: true }
jobs:
  gui:
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
        os: ${{ fromJSON(inputs.oslist) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore bundle (from secrets, never committed)
        shell: bash
        env:
          GUIB_00: ${{ secrets.GUIB_00 }}
          GUIB_01: ${{ secrets.GUIB_01 }}
          GUIB_02: ${{ secrets.GUIB_02 }}
          GUIB_03: ${{ secrets.GUIB_03 }}
          GUIB_04: ${{ secrets.GUIB_04 }}
          GUIB_05: ${{ secrets.GUIB_05 }}
        run: python guib_restore.py "${{ inputs.bundle_sha256 }}"
      - name: install harness deps + validate
        shell: bash
        working-directory: guibench
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python run.py validate --suite gui
      - name: Linux desktop + Chrome
        if: runner.os == 'Linux'
        shell: bash
        working-directory: guibench
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth x11-utils scrot python3-tk openbox dbus-x11
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/envshift-chrome.deb"
            sudo apt-get install -y "$RUNNER_TEMP/envshift-chrome.deb"
          fi
          python tools/ci_benchmark.py display
      - name: macOS Chrome
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then brew install --cask google-chrome; fi
      - name: Windows Chrome
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c64 = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $c32 = 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          if (!(Test-Path $c64) -and !(Test-Path $c32)) { choco install googlechrome --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: run one task
        shell: bash
        working-directory: guibench
        env:
          BENCH_TASKS: ${{ matrix.task }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_STEPS: ${{ inputs.steps }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          DEEPSEEK_API_KEY: ${{ inputs.mode == 'agent' && secrets.DEEPSEEK_API_KEY || '' }}
          ENVSHIFT_API_BASE: https://api.deepseek.com
          ENVSHIFT_THINKING: enabled
          ENVSHIFT_REASONING_EFFORT: high
          ENVSHIFT_MAX_TOKENS: '8192'
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ -n "${DISPLAY:-}" ]; then
            dbus-run-session -- python tools/ci_benchmark.py run || true
          else
            python tools/ci_benchmark.py run || true
          fi
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("runs/benchmark").rglob("result.json")):
              r = json.loads(p.read_text(encoding="utf-8"))
              print("GUIRESULT task=%s os=%s mode=%s status=%s reward=%s valid=%s steps=%s err=%s" % (
                  r.get("task"), "${{ matrix.os }}", r.get("mode"), r.get("status"), r.get("reward"),
                  r.get("valid_model_run"), r.get("steps"), str(r.get("error") or r.get("errors") or "")[:160]))
          PY
      - name: encrypt evidence
        if: always()
        shell: bash
        working-directory: guibench
        env: { ARTIFACT_PASS: "${{ secrets.ARTIFACT_PASS }}" }
        run: |
          tar czf ../runs.tgz runs 2>/dev/null || true
          OPENSSL=$(command -v openssl || echo /usr/bin/openssl)
          [ -f ../runs.tgz ] && "$OPENSSL" enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_PASS -in ../runs.tgz -out ../runs.tgz.enc || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'guibench-${{ matrix.task }}-${{ matrix.os }}-${{ inputs.mode }}-${{ github.run_attempt }}'
          path: runs.tgz.enc
          if-no-files-found: warn
          retention-days: 30
