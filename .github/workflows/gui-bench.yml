name: gui-bench
# Native v2 GUI 题包(从分片 secret 还原,不进公开仓)× 三系统:reference(不请求模型)或 agent(内置 DeepSeek GUI agent)。
on:
  workflow_dispatch:
    inputs:
      tasks: { description: "题号 JSON 数组", default: '["G01","G21"]' }
      oslist: { description: "runner 列表(JSON 数组)", default: '["ubuntu-24.04","macos-15","windows-2022"]' }
      mode: { description: "reference | agent", default: "reference" }
      model: { description: "内置 GUI agent 模型", default: "deepseek-flash" }
      api_base: { description: "OpenAI 兼容 base(deepseek 官网 https://api.deepseek.com;computrix https://maas-api.computrix.ai/v1)", default: "https://api.deepseek.com" }
      key_secret: { description: "API key 所在 secret 名", default: "DEEPSEEK_API_KEY" }
      steps: { description: "动作预算,空=各题默认", default: "" }
      parallel: { description: "max-parallel", default: "3" }
      bundle_sha256: { description: "题包 sha256,对不上就退出", required: true }
      bundle_prefix: { description: "题包 secret 前缀(GUIB…GUIB13),换题包用新前缀,别覆盖排队中的旧 run", default: "GUIB" }
      thinking: { description: "enabled(默认,DeepSeek 官网 thinking+effort high)| off(不发 thinking/reasoning_effort 字段;computrix 上跑 gpt/claude 必须 off)", default: "enabled" }
      http_timeout: { description: "模型请求读超时秒数,空=循环默认 180(长题/慢通道可拉长)", default: "" }
      max_completion: { description: "GUI 循环每步回答 token 上限,空=循环默认 300(网关上关不掉思考的模型要放开)", default: "" }
jobs:
  gui:
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
        os: ${{ fromJSON(inputs.oslist) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: { PYTHONUTF8: '1', PYTHONIOENCODING: 'utf-8' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: restore bundle (from secrets, never committed; shell=python 绕开 MSYS 路径转换)
        shell: python
        env:
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          BUNDLE_PREFIX: BUNDLE
          BUNDLE_PREFIX_REQUESTED: ${{ inputs.bundle_prefix }}
          # 只注入本次要用的题包:按 bundle_prefix 动态取 8 个槽。历史上把所有题包分片全塞进 env,
          # 主池 70+ 个 secret 撞上 macOS 1MB 参数上限 → restore 步骤 'Argument list too long'(2026-09-23 batch13 门一 mac 三格零日志)。
          BUNDLE_00: ${{ secrets[format('{0}_00', inputs.bundle_prefix)] }}
          BUNDLE_01: ${{ secrets[format('{0}_01', inputs.bundle_prefix)] }}
          BUNDLE_02: ${{ secrets[format('{0}_02', inputs.bundle_prefix)] }}
          BUNDLE_03: ${{ secrets[format('{0}_03', inputs.bundle_prefix)] }}
          BUNDLE_04: ${{ secrets[format('{0}_04', inputs.bundle_prefix)] }}
          BUNDLE_05: ${{ secrets[format('{0}_05', inputs.bundle_prefix)] }}
          BUNDLE_06: ${{ secrets[format('{0}_06', inputs.bundle_prefix)] }}
          BUNDLE_07: ${{ secrets[format('{0}_07', inputs.bundle_prefix)] }}
        run: |
          import runpy
          runpy.run_path("guib_restore.py", run_name="__main__")
      - name: install harness deps + validate
        shell: bash
        working-directory: guibench
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python run.py validate --suite gui
      - name: Linux desktop + Chrome
        if: runner.os == 'Linux'
        shell: bash
        working-directory: guibench
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth x11-utils scrot python3-tk openbox dbus-x11 gedit nautilus
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/envshift-chrome.deb"
            sudo apt-get install -y "$RUNNER_TEMP/envshift-chrome.deb"
          fi
          python tools/ci_benchmark.py display
      - name: macOS Chrome
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then brew install --cask google-chrome; fi
      - name: Windows Chrome
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c64 = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          $c32 = 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          if (!(Test-Path $c64) -and !(Test-Path $c32)) { choco install googlechrome --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: run one task
        shell: bash
        working-directory: guibench
        env:
          BENCH_TASKS: ${{ matrix.task }}
          BENCH_MODE: ${{ inputs.mode }}
          BENCH_MODEL: ${{ inputs.model }}
          BENCH_STEPS: ${{ inputs.steps }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          DEEPSEEK_API_KEY: ${{ inputs.mode == 'agent' && secrets[inputs.key_secret] || '' }}
          ENVSHIFT_API_KEY: ${{ inputs.mode == 'agent' && secrets[inputs.key_secret] || '' }}
          ENVSHIFT_API_BASE: ${{ inputs.api_base }}
          ENVSHIFT_THINKING: ${{ inputs.thinking }}
          ENVSHIFT_HTTP_TIMEOUT: ${{ inputs.http_timeout }}
          ENVSHIFT_MAX_COMPLETION: ${{ inputs.max_completion }}
          ENVSHIFT_REASONING_EFFORT: high
          ENVSHIFT_MAX_TOKENS: '8192'
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ -n "${DISPLAY:-}" ]; then
            dbus-run-session -- python tools/ci_benchmark.py run || true
          else
            python tools/ci_benchmark.py run || true
          fi
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("runs/benchmark").rglob("result.json")):
              r = json.loads(p.read_text(encoding="utf-8"))
              print("GUIRESULT task=%s os=%s mode=%s status=%s reward=%s valid=%s steps=%s err=%s" % (
                  r.get("task") or r.get("task_id"), "${{ matrix.os }}", r.get("mode"), r.get("status"), r.get("reward"),
                  r.get("valid_model_run"), r.get("steps"), str(r.get("error") or r.get("errors") or "")[:160]))
          # 装置诊断(只打结构字段,不打题面/模型文本):meta.json 与 loop.json
          for p in sorted(pathlib.Path("runs").rglob("meta.json")):
              m = json.loads(p.read_text(encoding="utf-8"))
              print("GUIMETA " + json.dumps({k: m.get(k) for k in ("task","arm","model_rc","timeout","steps","channel_fail","blind_steps","usage","valid_model_run","reward")}, ensure_ascii=False))
          for p in sorted(pathlib.Path("runs").rglob("loop.json")):
              l = json.loads(p.read_text(encoding="utf-8"))
              print("GUILOOP " + json.dumps({k: l.get(k) for k in ("steps","channel_fail","blind_steps","tool_version","http_errors","errors","stop_reason","finish")}, ensure_ascii=False)[:400])
          for p in sorted(pathlib.Path("runs").rglob("agent.log")):
              txt = p.read_text(encoding="utf-8", errors="replace")
              import re
              print("GUILOG %s lines=%d http_errs=%s tracebacks=%d last=%r" % (p.parent.name, txt.count(chr(10)), sorted(set(re.findall(r"HTTP[ _/]?(4\d\d|5\d\d)", txt))), txt.count("Traceback"), txt.strip().splitlines()[-1][:120] if txt.strip() else ""))
              for ln in txt.splitlines():
                  if "通道故障" in ln or "NO-API-KEY" in ln: print("GUICHAN " + ln[:220])
          PY
      - name: encrypt evidence
        if: always()
        shell: bash
        working-directory: guibench
        env: { ARTIFACT_PASS: "${{ secrets.GUIB_PASS }}" }
        run: |
          tar czf ../runs.tgz runs 2>/dev/null || true
          OPENSSL=$(command -v openssl || echo /usr/bin/openssl)
          [ -f ../runs.tgz ] && "$OPENSSL" enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_PASS -in ../runs.tgz -out ../runs.tgz.enc || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'guibench-${{ matrix.task }}-${{ matrix.os }}-${{ inputs.mode }}-${{ github.run_attempt }}'
          path: runs.tgz.enc
          if-no-files-found: warn
          retention-days: 30
